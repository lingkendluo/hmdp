<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>黑马点评 · 发现身边的好店</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
    <div class="hero">
        <div class="hero-top">
            <div class="loc">📍 三里屯</div>
            <img class="avatar" id="heroAvatar" src="/imgs/avatar/1.svg" alt="">
        </div>
        <div class="searchbar" id="searchBar">
            <span class="ico" id="searchIco"></span>
            <input id="searchInput" placeholder="搜索店铺、美食、探店笔记" readonly>
        </div>
        <div class="hero-slogan">今天想吃点什么？</div>
    </div>

    <div class="cats">
        <div class="cats-scroll" id="cats"></div>
    </div>

    <div class="section" style="margin-top:18px">
        <div class="section-head">
            <h2>限时秒杀</h2>
            <a class="more" href="/voucher-list.html">全部 ›</a>
        </div>
    </div>
    <div class="seckill-scroll" id="seckill"></div>

    <div class="section">
        <div class="section-head">
            <h2>热门探店</h2>
            <a class="more" href="/feed.html">更多 ›</a>
        </div>
    </div>
    <div class="hscroll" id="hotBlogs"></div>

    <div class="section">
        <div class="section-head">
            <h2 id="listTitle">为你推荐</h2>
        </div>
        <div id="shops"></div>
        <div class="empty" id="empty" style="display:none">
            <div class="ico">🍽️</div>
            <p>这个分类还没有店铺</p>
        </div>
        <div class="loadmore" id="sentinel"></div>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    document.getElementById('searchIco').innerHTML = ICON.search;
    document.getElementById('searchBar').onclick = () => location.href = '/search.html';

    let currentType = null;
    let pager = null;
    const shopsEl = document.getElementById('shops');
    const emptyEl = document.getElementById('empty');
    const sentinel = document.getElementById('sentinel');

    function initAvatar() {
        const img = document.getElementById('heroAvatar');
        img.src = HM.user?.icon || '/imgs/avatar/1.svg';
        img.onclick = () => { if (HM.isLogin()) location.href = '/me.html'; else goLogin(); };
    }

    async function loadCats() {
        const res = await api('/shop-type/list');
        const box = document.getElementById('cats');
        const all = {id: null, name: '全部', icon: '✨'};
        box.innerHTML = [all, ...res.data].map(t => `
            <button class="cat ${t.id === currentType ? 'on' : ''}" data-id="${t.id}">
                <span class="ico">${t.icon}</span>
                <span class="nm">${esc(t.name)}</span>
            </button>`).join('');

        box.querySelectorAll('.cat').forEach(el => {
            el.onclick = () => {
                currentType = el.dataset.id === 'null' ? null : Number(el.dataset.id);
                box.querySelectorAll('.cat').forEach(c => c.classList.toggle('on', c === el));
                document.getElementById('listTitle').textContent =
                    currentType ? el.querySelector('.nm').textContent + ' · 推荐' : '为你推荐';
                restart();
            };
        });
    }

    async function loadSeckill() {
        try {
            const res = await api('/voucher/seckill/list');
            const list = (res.data || []).slice(0, 6);
            const box = document.getElementById('seckill');
            if (!list.length) {
                box.innerHTML = '<div class="tiny" style="padding:0 4px">暂无秒杀活动</div>';
                return;
            }
            box.innerHTML = list.map(v => `
                <a class="seckill-card" href="/voucher.html?id=${v.id}">
                    <div class="sc-img"><img class="cover" src="${firstImg(v.shopImages || '')}" alt=""></div>
                    <div class="sc-body">
                        <div class="sc-title">${esc(v.title)}</div>
                        <div class="sc-sub">${esc(v.subTitle || '限时抢购')}</div>
                        <div class="sc-price">
                            <span class="price"><span class="unit">¥</span><span class="num">${yuan(v.payValue)}</span></span>
                            <span class="tag">${v.stock > 0 ? '剩 ' + v.stock + ' 张' : '已抢光'}</span>
                        </div>
                    </div>
                </a>`).join('');
        } catch (e) {
            /* ignore */
        }
    }

    async function loadHotBlogs() {
        const res = await api('/blog/hot?current=1');
        const list = (res.data || []).slice(0, 8);
        document.getElementById('hotBlogs').innerHTML = list.map(b => `
            <a class="mini-blog" href="/blog.html?id=${b.id}">
                <div class="pic">
                    <img class="cover" src="${firstImg(b.images)}" alt="">
                    <div class="ov">${esc(b.title)}</div>
                </div>
                <div class="cap">
                    <img src="${b.userIcon || '/imgs/avatar/1.svg'}" alt="">
                    <span>${esc(b.userName || '')}</span>
                </div>
            </a>`).join('');
    }

    function restart() {
        if (pager) {
            shopsEl.innerHTML = '';
            emptyEl.style.display = 'none';
        }
        pager = createPager({
            fetch: async (page) => {
                const params = new URLSearchParams({current: page});
                if (currentType) params.set('typeId', currentType);
                const r = await api('/shop/of/type?' + params.toString());
                return {list: r.data || [], total: r.total, size: 5};
            },
            render: (list, first) => {
                if (first) shopsEl.innerHTML = '';
                shopsEl.insertAdjacentHTML('beforeend', list.map(shopCardHtml).join(''));
            },
            sentinel,
            emptyEl
        });
    }

    document.addEventListener('DOMContentLoaded', async () => {
        renderTabbar('home');
        initAvatar();
        await loadCats().catch(() => toast('分类加载失败'));
        loadSeckill();
        loadHotBlogs().catch(() => {});
        restart();
    });
</script>
</body>
</html>
