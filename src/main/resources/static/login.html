<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>登录 · 黑马点评</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app no-tabbar">
    <div class="login-wrap">
        <div class="login-brand">
            <div class="logo">🍜</div>
            <h1>黑马点评</h1>
            <p>发现身边的好店，记录每一次心动</p>
        </div>

        <div class="login-form">
            <div class="field">
                <span style="font-size:17px">📱</span>
                <input id="phone" type="tel" maxlength="11" placeholder="请输入手机号" value="13800000001">
            </div>
            <div class="field">
                <span style="font-size:17px">🔐</span>
                <input id="code" type="tel" maxlength="6" placeholder="6 位验证码">
                <button class="code-btn" id="codeBtn">获取验证码</button>
            </div>
            <button class="btn btn-primary btn-block" id="loginBtn" style="margin-top:8px;height:48px">登录 / 注册</button>
        </div>

        <div class="login-tip">
            演示环境不发送真实短信，点击「获取验证码」后验证码会直接填入并在下方提示。
        </div>

        <div class="login-foot">
            登录即表示同意《用户协议》与《隐私政策》<br>
            黑马点评 · Redis 实战项目复刻
        </div>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    let counting = false;

    async function sendCode() {
        const phone = document.getElementById('phone').value.trim();
        if (!/^1\d{10}$/.test(phone)) {
            toast('请输入正确的手机号');
            return;
        }
        const btn = document.getElementById('codeBtn');
        if (counting) return;
        try {
            const res = await api('/user/code?phone=' + phone, {method: 'POST'});
            const code = res.data?.code;
            if (code) {
                document.getElementById('code').value = code;
                toast('验证码已自动填入：' + code, 2400);
            } else {
                toast('验证码已发送');
            }
            counting = true;
            let left = 60;
            btn.disabled = true;
            btn.textContent = left + 's 后重发';
            const t = setInterval(() => {
                left--;
                if (left <= 0) {
                    clearInterval(t);
                    counting = false;
                    btn.disabled = false;
                    btn.textContent = '重新获取';
                } else {
                    btn.textContent = left + 's 后重发';
                }
            }, 1000);
        } catch (e) {
            /* toast 已提示 */
        }
    }

    async function doLogin() {
        const phone = document.getElementById('phone').value.trim();
        const code = document.getElementById('code').value.trim();
        if (!/^1\d{10}$/.test(phone)) {
            toast('请输入正确的手机号');
            return;
        }
        if (!/^\d{6}$/.test(code)) {
            toast('请输入 6 位验证码');
            return;
        }
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '登录中…';
        try {
            const res = await api('/user/login', {method: 'POST', body: {phone, code}});
            HM.setAuth(res.data.token, res.data.user);
            toast('登录成功');
            const redirect = query('redirect');
            setTimeout(() => {
                location.href = redirect ? decodeURIComponent(redirect) : '/index.html';
            }, 400);
        } catch (e) {
            btn.disabled = false;
            btn.textContent = '登录 / 注册';
        }
    }

    document.getElementById('codeBtn').onclick = sendCode;
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('code').addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
