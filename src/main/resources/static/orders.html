<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>我的订单 · 黑马点评</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app" style="padding-bottom:20px">
    <header class="topbar">
        <button class="back" id="backBtn">‹</button>
        <div class="title">我的订单</div>
        <div class="spacer"></div>
    </header>

    <div class="section" id="list"></div>

    <div class="empty" id="empty" style="display:none">
        <div class="ico">🎫</div>
        <p>还没有抢过券</p>
        <a class="btn btn-ghost btn-sm" href="/voucher-list.html" style="margin-top:14px">去秒杀专区看看</a>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    const STATUS = {1: ['待支付', 'status-1'], 2: ['已支付', 'status-2'], 3: ['已核销', 'status-2'], 4: ['已取消', 'muted'], 5: ['已退款', 'muted']};
    const highlight = query('highlight');

    function orderHtml(o) {
        const st = STATUS[o.status] || ['未知', 'muted'];
        const no = String(o.id).slice(-10);
        return `
        <div class="order" ${String(o.id) === highlight ? 'style="box-shadow:0 0 0 2px #ff5a3c inset"' : ''}>
            <div class="o-top">
                <div class="o-img"><img class="cover" src="${firstImg(o.shopImages)}" alt=""></div>
                <div class="o-title">
                    ${esc(o.voucherTitle || '优惠券')}
                    <div class="tiny" style="font-weight:400;margin-top:4px">${esc(o.shopName || '')}</div>
                </div>
                <div style="text-align:right">
                    <div class="price"><span class="unit">¥</span><span class="num" style="font-size:16px">${yuan(o.payValue)}</span></div>
                    <div class="${st[1]} tiny" style="margin-top:2px;font-weight:600">${st[0]}</div>
                </div>
            </div>
            <div class="o-bot">
                <span class="o-no">订单号 ${no}</span>
                ${o.status === 1
                    ? `<button class="btn btn-primary btn-sm" data-pay="${o.id}">立即支付</button>`
                    : `<span class="tiny">${(o.createTime || '').replace('T', ' ').slice(0, 16)}</span>`}
            </div>
        </div>`;
    }

    async function load() {
        if (!HM.isLogin()) {
            goLogin();
            return;
        }
        const res = await api('/voucher-order/my');
        const list = res.data || [];
        if (!list.length) {
            document.getElementById('empty').style.display = 'block';
            return;
        }
        document.getElementById('list').innerHTML = list.map(orderHtml).join('');
        document.querySelectorAll('[data-pay]').forEach(btn => {
            btn.onclick = async () => {
                btn.disabled = true;
                btn.textContent = '支付中…';
                try {
                    await api('/voucher-order/pay/' + btn.dataset.pay, {method: 'PUT'});
                    toast('支付成功');
                    load();
                } catch (e) {
                    btn.disabled = false;
                    btn.textContent = '立即支付';
                }
            };
        });
    }

    document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
